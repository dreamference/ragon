# The release pipeline's builds and tests, for every platform: the test suite, the wheel and sdist,
# `ragon` for the GB10 (arm64 Linux) with its tools and their tests, the Linux desktop app, the Windows
# client and desktop installer (windows.yml), the Intel/AMD Linux and macOS clients
# (build-clients.yml) and the Mac dmgs (mac-preview.yml).
#
# Called by release.yml, which then signs and publishes what this uploads, and by
# release-dry-run.yml, which runs the same jobs nightly on main and publishes nothing. One file for
# both, so the dry run cannot drift from what a release builds. Nothing here tags, signs with the
# release key or touches a release: that is release.yml's `release` job alone.
name: Release build

on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into setup.py, the desktop apps and the ragon binaries"
        required: true
        type: string
      run_tests:
        description: "Gate the builds on the test suite"
        type: boolean
        default: true
      build_desktop:
        description: "Build the Linux desktop app (.deb; needs the ragon build, which it bundles)"
        type: boolean
        default: true
      desktop_runner:
        description: "Runner for the Linux desktop build"
        type: string
        default: ubuntu-24.04-arm
      build_ragon:
        description: "Build the ragon binaries that `ragon update` installs"
        type: boolean
        default: true
      ragon_runner:
        description: "Runner for the ragon build; its architecture names the assets"
        type: string
        default: ubuntu-24.04-arm
      build_windows:
        description: "Build the Windows client and desktop installer (windows.yml)"
        type: boolean
        default: true
      windows_x64_runner:
        description: "Runner for the x86-64 Windows build: box (the WINDOWS_X64_RUNNER variable's self-hosted runner, if set) or github"
        type: string
        default: box
      build_clients:
        description: "Build the Intel/AMD Linux and macOS clients (build-clients.yml)"
        type: boolean
        default: false
      macos_runner:
        description: "Runner for the Apple silicon client build: mac (the MACOS_RUNNER variable's self-hosted runner, if set) or github"
        type: string
        default: mac
      build_mac_preview:
        description: "Build the Mac dmgs (mac-preview.yml); needs build_clients"
        type: boolean
        default: true
      sign:
        description: "Sign and notarise the macOS builds with the Developer ID when the release environment has the Apple secrets"
        type: boolean
        default: false
    outputs:
      mac_signed:
        description: "true when mac-preview signed, notarised and stapled the dmgs"
        value: ${{ jobs.desktop-mac.outputs.signed }}

# Read-only: mac-preview.yml declares actions: read (for another run's artifacts), so a caller grants
# contents: read and actions: read.
permissions:
  contents: read
  actions: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  test:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # The pip cache is keyed on a dependency file, and this project declares its
          # dependencies in setup.py, not requirements.txt or pyproject.toml.
          cache-dependency-path: setup.py
      - name: Install
        # `.[dev]` brings the pinned ruff and mypy the code-standard ratchets (tests/test_code_quality.py, tests/test_typing.py) need.
        run: pip install -e ".[dev]" pytest
      # No GPU or Docker needed: every hardware and subprocess call in the suite is mocked.
      - name: Test
        run: python -m pytest tests/ -q

  python-dist:
    needs: [test]
    # `test` is skipped when run_tests is off; skipped still counts as clear to proceed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Stamp version
        run: sed -i -E "s/version=\"[^\"]+\"/version=\"$VERSION\"/" setup.py && grep -n 'version=' setup.py
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          # The installer for a machine with no checkout (README, "Install from a release"): it
          # downloads this release's other assets, so it travels with them.
          cp install.sh dist/
          # Its Windows counterpart, for the Windows client's assets when the release carries them.
          cp install.ps1 dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  desktop:
    # The Electron app bundles `ragon` and `codex-code-mode-host` (desktop/electron, built the way
    # the Codex desktop app is built), so it waits for the `ragon` job and takes its binaries.
    needs: [test, ragon]
    if: ${{ inputs.build_desktop && inputs.build_ragon && !failure() && !cancelled() }}
    runs-on: ${{ inputs.desktop_runner }}
    env:
      RAGON_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ragon-binaries
          path: dist
      - name: Bundled binaries
        run: |
          # Named exactly: `ragon-*` would also match ragon-search, ragon-fetch and ragon-code.
          target="$(uname -m)-unknown-linux-gnu"
          mkdir -p desktop/electron/resources
          gunzip -c "dist/ragon-$target.gz" > desktop/electron/resources/ragon
          gunzip -c "dist/codex-code-mode-host-$target.gz" > desktop/electron/resources/codex-code-mode-host
          chmod 755 desktop/electron/resources/ragon desktop/electron/resources/codex-code-mode-host
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # Work's UI (desktop/ui), bundled into the app by its Vite build; its tests need no Electron.
      - name: Work window frontend
        working-directory: desktop/ui
        run: |
          npm ci
          npm test
      # The main process's unit tests, the typecheck, then Forge: Vite builds, `package` writes
      # out/Ragon-linux-<arch>/ and flips the fuses, `make` wraps it in the .deb (and a zip).
      - name: Build the app
        working-directory: desktop/electron
        run: |
          npm ci
          # Electron 42's package has no install step: the binary is fetched the first time anything
          # requires `electron`, and vitest's parallel workers raced each other to fetch it. Once,
          # here, with one retry, before any test; a no-op when it is already there.
          node node_modules/electron/install.js || { sleep 15; node node_modules/electron/install.js; }
          npm run typecheck
          npm test
          npm run make
          # Again, now that the bundles exist: no credential string in the preload or Work's page.
          npx vitest run src/credentials.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-bundles
          path: |
            desktop/electron/out/make/deb/*/*.deb
          if-no-files-found: error

  ragon:
    needs: [test]
    if: ${{ inputs.build_ragon && !failure() && !cancelled() }}
    runs-on: ${{ inputs.ragon_runner }}
    env:
      # Compiled into the launcher, so `ragon update` can tell whether a newer release exists.
      RAGON_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Only the pinned Codex fork; the ragon-engine submodule (a spec) plays no part in the build.
      - name: Codex submodule
        run: git submodule update --init --depth 1 codex
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install ragon-admin
        run: pip install -e .
      # Only the registry is cached: Codex's target directory runs to many gigabytes, past what the
      # Actions cache holds. rustup fetches the toolchain codex-rs/rust-toolchain.toml pins.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'codex-patches/**', 'ragon-rs/**', 'ragon-web-rs/Cargo.lock', 'ragon-code-rs/Cargo.lock', 'ragon-docs-rs/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.arch }}-
      # `ragon web` serves the Ragon UI from inside the binary: the build runs desktop/ui's
      # Vite build first and embeds it (RAGON_WEB_UI_DIST, ragon-rs/web/build.rs).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # The same build `ragon-admin codex build` runs locally: export the submodule, add
      # ragon-rs/, apply codex-patches/, cargo build with prebuilt V8 fetched and verified; then
      # the web commands from ragon-web-rs/, the code index router from ragon-code-rs/ and the local
      # file index from ragon-docs-rs/, each a separate --locked build. The file index's build also
      # fetches what it loads (PDFium, ONNX Runtime, its model), pinned; none of that is packaged.
      - name: Build ragon
        run: ragon-admin codex build --force
      # Their own tests run the two binaries against a local stand-in for SearXNG and for web
      # pages; the build above has installed the toolchain they need.
      - name: Test the web commands
        working-directory: ragon-web-rs
        run: ~/.cargo/bin/cargo test --release --locked
      # Its scopes and sandbox are stand-ins in the tests; the PDF and model cases run only when
      # RAGON_DOCS_LIB_DIR and RAGON_DOCS_MODEL_DIR are set, which they are not here.
      - name: Test the local file index
        working-directory: ragon-docs-rs
        run: ~/.cargo/bin/cargo test --release --locked
      # The messenger bridges' crates (Signal, and Matrix and Telegram through `ragon chat`), the sync
      # agent (`ragon sync`, against a real hub on loopback) and the loop guard's detector
      # (ragon-rs/loop-guard), in the
      # export the build above left, with its profile, so nothing is compiled twice. Their
      # stand-ins for signal-cli, `ragon web`, the Bot API and the homeserver run on loopback.
      - name: Test the messenger bridges
        run: |
          cd "$HOME/.cache/dreamference/ragon-codex/src/codex-rs"
          CARGO_TARGET_DIR="$HOME/.cache/dreamference/ragon-codex/target" \
          CARGO_PROFILE_RELEASE_DEBUG=none CARGO_PROFILE_RELEASE_STRIP=debuginfo \
            ~/.cargo/bin/cargo test --release -p ragon-signal -p ragon-chat -p ragon-sync -p ragon-loop-guard
      - name: Package
        run: |
          bin="$(dirname "$(python -c 'from dreamference.runner.codex_branded_builder import CodexBrandedBuilder as B; print(B.executable_path())')")"
          target="$(uname -m)-unknown-linux-gnu"
          mkdir -p dist
          gzip -9 -c "$bin/ragon" > "dist/ragon-$target.gz"
          gzip -9 -c "$bin/codex-code-mode-host" > "dist/codex-code-mode-host-$target.gz"
          gzip -9 -c "$bin/ragon-search" > "dist/ragon-search-$target.gz"
          gzip -9 -c "$bin/ragon-fetch" > "dist/ragon-fetch-$target.gz"
          # The router only: `ragon-admin code setup` fetches the indexers it runs.
          gzip -9 -c "$bin/ragon-code" > "dist/ragon-code-$target.gz"
          # The local file index, binary only: `ragon-admin docs setup` fetches PDFium, ONNX Runtime
          # and the embedding model it loads, each pinned (specs/DREAMFERENCE_RAGON_LOCAL_INDEX.md §17).
          gzip -9 -c "$bin/ragon-docs" > "dist/ragon-docs-$target.gz"
          # Ragon over Signal's bridge, binary only and off until `ragon signal setup`, which
          # fetches signal-cli and its Java runtime, pinned (specs/DREAMFERENCE_RAGON_SIGNAL.md §3).
          gzip -9 -c "$bin/ragon-signal" > "dist/ragon-signal-$target.gz"
          # The delegation plugin's server, binary only (specs/DREAMFERENCE_RAGON_CLAUDE_PLUGIN.md §14).
          gzip -9 -c "$bin/ragon-delegate" > "dist/ragon-delegate-$target.gz"
          # Ragon began as a fork of the Codex CLI (Apache 2.0), whose licence and notice must
          # travel with the binaries (Apache 2.0 section 4); the names say what they belong to.
          cp codex/LICENSE dist/THIRD-PARTY-LICENSE-codex-cli.txt
          cp codex/NOTICE dist/THIRD-PARTY-NOTICE-codex-cli.txt
          # `ragon update` checks every archive against this file before installing any.
          (cd dist && sha256sum "ragon-$target.gz" "codex-code-mode-host-$target.gz" \
            "ragon-search-$target.gz" "ragon-fetch-$target.gz" "ragon-code-$target.gz" \
            "ragon-docs-$target.gz" "ragon-signal-$target.gz" "ragon-delegate-$target.gz" > "ragon-$target.sha256sums")
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ragon-binaries
          path: dist/*
          if-no-files-found: error

  # The Windows client (specs/DREAMFERENCE_RAGON_WINDOWS_ARM.md, Phase 1): the same workflow that
  # runs on pushes to windows/** branches, with this release's version compiled in.
  windows:
    needs: [test]
    if: ${{ inputs.build_windows && !failure() && !cancelled() }}
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ inputs.version }}
      windows_x64_runner: ${{ inputs.windows_x64_runner }}

  # The client for machines that are not a GB10 (x86-64 Linux, macOS), built by the same workflow
  # CI runs on clients/** branches; its artifacts are named ragon-client-<target>.
  ragon-clients:
    needs: [test]
    if: ${{ inputs.build_clients && !failure() && !cancelled() }}
    uses: ./.github/workflows/build-clients.yml
    with:
      version: ${{ inputs.version }}
      macos_runner: ${{ inputs.macos_runner }}
      # The macOS binaries signed and notarised with the Developer ID when the caller asks (a release)
      # and the Apple secrets are in the release environment; unsigned while they are not
      # (docs/dev/macos-signing.md).
      sign: ${{ inputs.sign }}

  # The Mac desktop app: the Electron app with the macOS ragon of `ragon-clients` inside, one dmg per
  # architecture, named Ragon-<version>-<arch>-preview.dmg. Signed with the Developer ID,
  # notarised and stapled once the Apple secrets are in the release environment; until then an
  # unsigned preview, signed ad hoc only (docs/dev/macos-signing.md).
  desktop-mac:
    needs: [test, ragon-clients]
    if: ${{ inputs.build_mac_preview && inputs.build_clients && !failure() && !cancelled() }}
    # The called workflow declares actions: read (for another run's artifacts); a caller must grant
    # at least what it asks. Here it reads only this run's.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/mac-preview.yml
    with:
      version: ${{ inputs.version }}
      client_run_id: this
      sign: ${{ inputs.sign }}

