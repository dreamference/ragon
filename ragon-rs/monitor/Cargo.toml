# `ragon monitor`, the session monitor (specs/DREAMFERENCE_RAGON_CLAUDE_PLUGIN.md Part B): plain
# code that reads the agents' transcripts on this machine, read-only, and writes one summary and a few
# short alerts. No model, no network, no port. A crate of its own so its tests run without compiling
# the Codex workspace (`cargo test` in a copy of this folder); the launcher (`../src/monitor.rs`) only
# routes `ragon monitor …` here. The small `ragon-monitor` binary runs the same commands where the
# installed `ragon` predates the monitor. Versions are the Codex workspace's, so building inside it
# adds no second copy of any crate.
[package]
name = "ragon-monitor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ragon_monitor"
path = "src/lib.rs"

[[bin]]
name = "ragon-monitor"
path = "src/main.rs"

[dependencies]
# Host-side git with the program-running config keys turned off.
ragon-safegit = { path = "../safegit" }
chrono = "0.4.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.5"
