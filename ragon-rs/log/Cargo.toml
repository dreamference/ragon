# Ragon's log writer (specs/DREAMFERENCE_LOGGING.md §4 to §7): the level spec, one line format,
# redaction at the writer, the sampler and file rotation. Its own crate so its tests and the shared
# vectors in `vectors/` run without the rest of the launcher. regex, hmac and sha2 come from the
# workspace; there is no logging or network crate.
[package]
name = "ragon-log"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ragon_log"
path = "src/lib.rs"

[dependencies]
flate2 = { workspace = true }
hmac = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
