# `ragon delegate`, the Ragon delegation server and CLI for Claude Code
# (specs/DREAMFERENCE_RAGON_CLAUDE_PLUGIN.md Part A): Phase P1 ships class W1 (`watch`),
# which waits on one local condition from a closed list and returns `{met, observed, at}` with
# no model turn. A crate of its own so its tests run without compiling the Codex workspace
# (`cargo test` in a copy of this folder); the launcher (`../src/delegate.rs`) routes
# `ragon delegate …` here, and the small `ragon-delegate` binary runs the same commands standalone.
# Versions match the Codex workspace so building inside it adds no second copy of any crate.
[package]
name = "ragon-delegate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ragon_delegate"
path = "src/lib.rs"

[[bin]]
name = "ragon-delegate"
path = "src/main.rs"

[dependencies]
# Host-side git with the program-running config keys turned off.
ragon-safegit = { path = "../safegit" }
chrono = "0.4.43"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.5"
