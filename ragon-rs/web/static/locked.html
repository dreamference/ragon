<h1>Sign in to Ragon</h1>
<p>On the Ragon machine itself, run <code>ragon web open</code>: it opens this page signed in.</p>
<p>On another device, run <code>ragon web pair</code> on the Ragon machine, then <a href="/pair">pair this device</a> with the code it shows.</p>
