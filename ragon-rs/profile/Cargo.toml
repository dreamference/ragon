# `ragon profile`, the measurement core (specs/DREAMFERENCE_PROFILING.md O2, §3, §5.4): plain code that
# sends the fixed workloads to a model server on loopback, reads /metrics, /spec_stats and the engine's
# request line, computes the §3 figures and writes result.json, table.md, requests.jsonl and
# machine.jsonl under ~/.local/share/dreamference/profile/. No model, no telemetry. A leaf crate of its
# own so its tests run without compiling the Codex workspace (`cargo test` in a copy of this folder).
# The `ragon-profile` binary runs the same commands where the launcher does not yet route
# `ragon profile …` here. Versions are the Codex workspace's, so building inside it adds no second copy.
[package]
name = "ragon-profile"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ragon_profile"
path = "src/lib.rs"

[[bin]]
name = "ragon-profile"
path = "src/main.rs"

[dependencies]
# The launcher's home directory: HOME, else USERPROFILE.
ragon-node-locator = { path = "../node-locator" }
chrono = "0.4.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
